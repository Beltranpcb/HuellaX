# ARCHIVO: m6_huella_espectral/pytest.ini
# ROL: Declara el nombrado en español de las pruebas de este módulo, para que
#   `pytest` las recoja igual cuando el módulo se ejecuta suelto (sin el
#   pytest.ini de la raíz del repositorio).
# VERIFICACION: `python -m pytest --collect-only -q` desde m6_huella_espectral/ lista
#   las pruebas de pruebas/.

[pytest]
python_files = prueba_*.py
python_functions = prueba_*
testpaths = pruebas
