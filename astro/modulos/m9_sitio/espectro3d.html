     VERIFICACION: Abre sin errores de consola y dibuja un listón por espectro.

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huellas espectrales en 3D · HUELLA X</title>
<link rel="stylesheet" href="estilo.css">
<style>
  body { margin: 0; overflow: hidden; background: #0b0f1a; }
  #barra3d {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
    padding: .7rem 1rem;
    background: rgba(11, 15, 26, .88);
    border-bottom: 1px solid var(--borde-suave);
    backdrop-filter: blur(8px);
  }
  #barra3d .titulo { font-weight: 700; letter-spacing: .12em; font-size: .95rem; }
  #barra3d .titulo span { color: var(--acento); }
  #campo3d { font-family: var(--mono); font-size: .78rem; color: var(--texto_secundario); }
  #barra3d .acciones { margin-left: auto; display: flex; gap: .5rem; }
  #barra3d button { font-size: .8rem; padding: .3rem .7rem; }
  #barra3d button.activo { border-color: var(--acento); color: var(--acento); }
  #escena { position: fixed; inset: 0; }
  #escena canvas { display: block; }
  #aviso3d {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 20; max-width: 32rem; text-align: center;
    padding: 1rem 1.4rem; border-radius: var(--radio);
    background: var(--panel); border: 1px solid var(--borde);
    color: var(--texto_secundario); font-size: .9rem;
  }
  #aviso-giro {
    position: fixed; left: 50%; top: 4.6rem; transform: translateX(-50%);
    z-index: 15; margin: 0; padding: .5rem .9rem; border-radius: 999px;
    background: rgba(255, 179, 71, .12); border: 1px solid rgba(255, 179, 71, .35);
    color: #e8c98f; font-size: .78rem;
  }
  #ayuda3d {
    position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
    z-index: 10; margin: 0; font-size: .74rem; color: var(--texto-apagado);
    font-family: var(--mono);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header id="barra3d">
  <div class="titulo">HUELLA <span>X</span></div>
  <span id="campo3d">cargando…</span>
  <div class="acciones">
    <button id="btn-conectar">Unir listones</button>
    <button id="btn-reiniciar">Reiniciar vista</button>
    <a href="index.html#app"><button>← Explorador</button></a>
  </div>
</header>

<div id="escena"></div>
<p id="aviso3d" hidden></p>
<p id="aviso-giro" hidden>Gira el dispositivo para ver la escena completa.</p>
<p id="ayuda3d">arrastra para girar · rueda para acercar</p>

<script type="module" src="espectro3d.js"></script>
</body>
</html>
