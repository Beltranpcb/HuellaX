# ARCHIVO: pytest.ini
# ROL: Declara el nombrado en español de las pruebas para pytest.
# LEE: Nada.
# PRODUCE: La regla por la que pytest recoge los archivos prueba_*.py con funciones prueba_*.
# VERIFICACION: `python -m pytest --collect-only -q` lista las pruebas de modulos/*/pruebas/.

[pytest]
python_files = prueba_*.py
python_functions = prueba_*
